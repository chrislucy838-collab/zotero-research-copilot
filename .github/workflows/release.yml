name: Release Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate XPI before publishing
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          xpi=".scaffold/build/Zotero-Research-Copilot-${version}.xpi"
          npm run validate:xpi -- "$xpi" "$version"

      - name: Publish validated XPI and update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          xpi=".scaffold/build/Zotero-Research-Copilot-${version}.xpi"
          update_json=".scaffold/build/update.json"
          test -s "$xpi"
          test -s "$update_json"
          gh release create "${GITHUB_REF_NAME}" "$xpi" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release ${GITHUB_REF_NAME}" \
            --generate-notes
          if gh release view release --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload release "$update_json" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create release "$update_json" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Release Manifest" \
              --prerelease
          fi
